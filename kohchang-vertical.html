<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koh Chang Holiday Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:#000}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
#stage video.on{opacity:1}
.logo,.caption{transition:opacity 1s ease}
#stage.card .logo,#stage.card .caption{opacity:0}
.logo{position:absolute;z-index:2;top:60px;left:50%;transform:translateX(-50%);height:400px;width:auto;filter:drop-shadow(0 4px 14px rgba(0,0,0,.25))}
.caption{position:absolute;left:0;right:0;bottom:0;z-index:2;text-align:center;color:#fff;padding:190px 80px 95px;background:linear-gradient(transparent,rgba(0,0,0,.6));text-shadow:0 2px 12px rgba(0,0,0,.45)}
.caption b{display:block;font-family:"Bricolage Grotesque","Arial Black",Arial,sans-serif;font-weight:700;font-size:76px;line-height:1.1}
.caption span{display:block;font-family:Figtree,Arial,sans-serif;font-weight:600;font-size:33px;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase;opacity:.9;margin-top:20px}
</style></head><body>
<!-- Koh Chang screen (5 Nov 2026): holiday videos in a loop, then a Tours & Transfers end card.
     The previous yellow Money Exchange design is kept as kohchang-money-exchange.html. -->
<div id="stage">
  <video id="vA" muted playsinline preload="auto"></video>
  <video id="vB" muted playsinline preload="auto"></video>
  <img class="logo" src="kohchang-video/logo.png" alt="Peyton &amp; Charmed Group">
  <div class="caption"><b>Welcome to Koh Chang</b><span>Money Exchange &middot; Tours &middot; Transfers</span></div>
</div>
<script>
// The monitor stands upright but the laptop sends a landscape picture, so turn the design by 90 degrees
// (same as the old board). Add ?flip if it is upside down, ?noturn to switch turning off.
function fit(){
  var st=document.getElementById('stage'), q=(location.search||'').toLowerCase();
  var turn = innerWidth > innerHeight && q.indexOf('noturn') < 0;
  var W = turn ? innerHeight : innerWidth, H = turn ? innerWidth : innerHeight;
  var k = Math.min(W/1080, H/1920), rot = turn ? (q.indexOf('flip') >= 0 ? 90 : -90) : 0;
  st.style.transform='translate(-50%,-50%) rotate('+rot+'deg) scale('+k+')';
}
addEventListener('resize',fit);fit();

// Play the clips one after another, forever. The last clip is the Tours & Transfers end card,
// which has its own logo and text, so the page's logo and caption fade out for it.
(function(){
  var clips=['kohchang-video/clip1.mp4','kohchang-video/clip2.mp4','kohchang-video/clip3.mp4','kohchang-video/clip4.mp4'];
  var END=3, stage=document.getElementById('stage');
  var vids=[document.getElementById('vA'),document.getElementById('vB')], cur=0, idx=0;
  function load(v,i){ v.src=clips[i]; v.load(); }
  function play(v){ var p=v.play(); if(p&&p.catch) p.catch(function(){}); }
  load(vids[0],0); vids[0].classList.add('on'); play(vids[0]); load(vids[1],1);
  function next(){
    if(next.busy) return; next.busy=true; setTimeout(function(){ next.busy=false; },1500);
    var showing=vids[cur], nv=vids[1-cur];
    idx=(idx+1)%clips.length;
    nv.currentTime=0; play(nv); nv.classList.add('on'); showing.classList.remove('on');
    stage.classList.toggle('card', idx===END);
    cur=1-cur;
    setTimeout(function(){ showing.pause(); load(showing,(idx+1)%clips.length); },1300);
  }
  vids.forEach(function(v){
    v.addEventListener('ended',function(){ if(v===vids[cur]) next(); });
    v.addEventListener('error',function(){ if(v===vids[cur]) setTimeout(next,1000); });
  });
  // Watchdog: if the clip on screen has ended, paused or frozen, move on so the show never stops.
  var lastT=-1, still=0;
  setInterval(function(){
    var v=vids[cur];
    if(v.ended){ next(); still=0; return; }
    if(v.paused&&v.readyState>=2) play(v);
    // count only when the clip has loaded and should be moving, so slow Wi-Fi is never mistaken for a freeze
    if(!v.paused&&v.readyState>=3&&Math.abs(v.currentTime-lastT)<0.01){ if(++still>=8){ still=0; next(); } } else still=0;
    lastT=v.currentTime;
  },2000);
  // Reload the page once a day at 6am so changes reach the screen without anyone touching it.
  setInterval(function(){ var d=new Date(); if(d.getHours()===6&&d.getMinutes()===0) location.reload(); },60000);
  // Ask the laptop to keep the screen on while this page is showing.
  function awake(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} }
  awake(); document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ awake(); play(vids[cur]); } });
})();
</script>
<div id="sndBtn" style="position:fixed;right:10px;bottom:10px;z-index:99;font:700 14px Arial;background:rgba(10,22,40,.75);color:#f5c842;border-radius:999px;padding:6px 12px;cursor:pointer">&#128263; sound: off &middot; press M</div>
<script>
// Spoken advert (30 Oct 2026): the page keeps repeating "money exchange, come in"
// in Russian, German and French, using the voices built into Chrome on the laptop.
// Click once anywhere (or the little button) to switch sound on; add ?quiet to hide it.
(function () {
  var LINES = [
    { lang: 'ru', text: 'Обмен валют, выгодный курс, заходите!' },
    { lang: 'de', text: 'Geldwechsel, gute Kurse, kommen Sie herein!' },
    { lang: 'fr', text: 'Bureau de change, bons taux, entrez !' }
  ];
  var GAP_MS = 25 * 1000;   // a short music-only moment between rounds; repeats all day
  var q = (location.search || '').toLowerCase();
  var m = q.match(/say=(\d+)/); if (m) GAP_MS = Math.max(5, parseInt(m[1], 10)) * 1000;
  var on = false, timer = null, btn = document.getElementById('sndBtn');
  if (!('speechSynthesis' in window) || q.indexOf('quiet') >= 0) { btn.style.display = 'none'; return; }



  function voiceFor(lang) {
    // Prefer the most human-sounding voices: Google's online voices first,
    // then Microsoft "Natural" voices, then any online voice, then whatever is installed.
    var vs = speechSynthesis.getVoices(), pick = null, score = -1;
    for (var i = 0; i < vs.length; i++) {
      var v = vs[i];
      if (!v.lang || v.lang.toLowerCase().indexOf(lang) !== 0) continue;
      var sc = 0;
      if (v.name.indexOf('Google') === 0) sc = 6;
      else if (v.name.indexOf('Natural') >= 0) sc = 4;
      else if (!v.localService) sc = 2;
      // prefer a female voice
      if (/jenny|aria|michelle|emma|ana|zira|svetlana|irina|dariya|katja|amala|elke|hedda|denise|eloise|vivienne|hortense|julie|female/i.test(v.name)) sc += 1;
      if (sc > score) { score = sc; pick = v; }
    }
    return pick;
  }
  function announce() {
    if (!on) return;
    speechSynthesis.cancel();
    var spoken = 0, last = null;
    LINES.forEach(function (l) {
      var v = voiceFor(l.lang); if (!v) return;   // a language with no voice installed is skipped
      var u = new SpeechSynthesisUtterance(l.text);
      u.voice = v; u.lang = v.lang; u.rate = 1.0; u.pitch = 1.05; u.volume = 1;
      speechSynthesis.speak(u); spoken++; last = u;
    });
    if (timer) clearTimeout(timer);
    if (spoken === 0) { timer = setTimeout(announce, 20000); return; }
    last.onend = function () { if (on) timer = setTimeout(announce, GAP_MS); };
    timer = setTimeout(announce, 150000);   // safety net if onend never fires
  }
  function setOn(v) {
    on = v; btn.innerHTML = on ? '&#128266; sound: on &middot; press M' : '&#128263; sound: off &middot; press M';
    if (timer) { clearTimeout(timer); timer = null; }
    if (on) { announce(); } else { speechSynthesis.cancel(); }
  }
  btn.addEventListener('click', function (e) { e.stopPropagation(); setOn(!on); });
  document.addEventListener('keydown', function (e) { if (e.key === 'm' || e.key === 'M') setOn(!on); });
  document.addEventListener('click', function once() { if (!on) setOn(true); document.removeEventListener('click', once); });
  speechSynthesis.getVoices();
})();
</script>
</body></html>
