<script>
// Advertising-only Koh Chang screen (27 Oct 2026): yellow flashing design, no rates.
function fit(){
  // The monitor stands upright but the laptop sends a landscape picture, so turn the design by 90 degrees
  // (same as the old rate board). Add ?flip if it is upside down, ?noturn to switch turning off.
  var st=document.getElementById('stage'), q=(location.search||'').toLowerCase();
  var turn = innerWidth > innerHeight && q.indexOf('noturn') < 0;
  var W = turn ? innerHeight : innerWidth, H = turn ? innerWidth : innerHeight;
  var k = Math.min(W/1080, H/1920), rot = turn ? (q.indexOf('flip') >= 0 ? 90 : -90) : 0;
  st.style.transform='translate(-50%,-50%) rotate('+rot+'deg) scale('+k+')';
}
addEventListener('resize',fit);fit();
</script>
<div id="sndBtn" style="position:fixed;right:10px;bottom:10px;z-index:99;font:700 14px Arial;background:rgba(10,22,40,.75);color:#f5c842;border-radius:999px;padding:6px 12px;cursor:pointer">&#128263; sound: off</div>
<script>
// Spoken advert (30 Oct 2026): every few minutes the page says "money exchange, come in"
// in English, Russian, German and French, using the voices built into Chrome on the laptop.
// Click once anywhere (or the little button) to switch sound on; add ?quiet to hide it.
(function () {
  var LINES = [
    { lang: 'en', text: 'Money exchange! Great rates. Come in!' },
    { lang: 'ru', text: 'Обмен валют! Выгодный курс. Заходите!' },
    { lang: 'de', text: 'Geldwechsel! Gute Kurse. Kommen Sie herein!' },
    { lang: 'fr', text: 'Bureau de change ! Bons taux. Entrez !' }
  ];
  var EVERY_MS = 3 * 60 * 1000;   // every 3 minutes
  var q = (location.search || '').toLowerCase();
  var m = q.match(/say=(\d+)/); if (m) EVERY_MS = Math.max(30, parseInt(m[1], 10)) * 1000;
  var on = false, timer = null, btn = document.getElementById('sndBtn');
  if (!('speechSynthesis' in window) || q.indexOf('quiet') >= 0) { btn.style.display = 'none'; return; }

  function voiceFor(lang) {
    var vs = speechSynthesis.getVoices(), best = null;
    for (var i = 0; i < vs.length; i++) {
      if (vs[i].lang && vs[i].lang.toLowerCase().indexOf(lang) === 0) { best = vs[i]; if (vs[i].localService) break; }
    }
    return best;
  }
  function announce() {
    if (!on) return;
    speechSynthesis.cancel();
    LINES.forEach(function (l) {
      var v = voiceFor(l.lang); if (!v) return;   // a language with no voice installed is skipped
      var u = new SpeechSynthesisUtterance(l.text);
      u.voice = v; u.lang = v.lang; u.rate = 0.95; u.volume = 1;
      speechSynthesis.speak(u);
    });
  }
  function setOn(v) {
    on = v; btn.innerHTML = on ? '&#128266; sound: on' : '&#128263; sound: off';
    if (timer) { clearInterval(timer); timer = null; }
    if (on) { announce(); timer = setInterval(announce, EVERY_MS); } else { speechSynthesis.cancel(); }
  }
  btn.addEventListener('click', function (e) { e.stopPropagation(); setOn(!on); });
  document.addEventListener('click', function once() { if (!on) setOn(true); document.removeEventListener('click', once); });
  speechSynthesis.getVoices();
})();
</script>
