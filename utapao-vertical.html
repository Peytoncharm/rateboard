<title>U-Tapao Exchange Rate (vertical)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sarabun:wght@400;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* VERTICAL (portrait) rate board.
     The monitor is turned on its side. A smart monitor's own browser cannot rotate the picture,
     so this page draws itself turned by 90 degrees. Add ?flip to the address if it appears upside down.
     If the screen is already portrait (for example a PC with Windows set to Portrait) nothing is rotated.
     --u = 1% of the board's width, --v = 1% of the board's height, whichever way the screen is turned. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1628; }
  html { --u: 1vw; --v: 1vh; }
  html.turned { --u: 1vh; --v: 1vw; }
  #stage {
    position: absolute; top: 50%; left: 50%;
    width: calc(var(--u) * 100); height: calc(var(--v) * 100);
    transform: translate(-50%, -50%);
    background: #ffffff; font-family: 'Sarabun', 'Arial', sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  html.turned #stage { transform: translate(-50%, -50%) rotate(-90deg); }
  html.turned.flip #stage { transform: translate(-50%, -50%) rotate(90deg); }

  .header {
    background: linear-gradient(135deg, #0a1628 0%, #1a2744 50%, #0a1628 100%);
    text-align: center; padding: calc(var(--v) * 2.2) calc(var(--u) * 3) calc(var(--v) * 1.8); flex-shrink: 0;
  }
  .header h1 {
    font-family: 'Bebas Neue', 'Arial Narrow', 'Arial', sans-serif; font-weight: 400;
    font-size: min(calc(var(--u) * 10.5), calc(var(--v) * 6.2)); color: #f5c842; letter-spacing: 0.06em; line-height: 1;
  }
  .header .site { font-size: min(calc(var(--u) * 4.2), calc(var(--v) * 2.4)); color: #ffffff; font-weight: 700; letter-spacing: 0.14em; margin-top: calc(var(--v) * 0.8); }
  .header .date { font-size: min(calc(var(--u) * 3.1), calc(var(--v) * 1.8)); color: rgba(255,255,255,0.7); margin-top: calc(var(--v) * 0.4); letter-spacing: 0.05em; }
  .table-header {
    display: flex; justify-content: space-between; background: #4a5568; color: #fff; font-weight: 700;
    font-size: min(calc(var(--u) * 3.4), calc(var(--v) * 1.9)); letter-spacing: 0.06em;
    padding: calc(var(--v) * 0.8) calc(var(--u) * 4); flex-shrink: 0;
  }
  .rate-rows { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .rate-row {
    flex: 1; min-height: 0; display: flex; align-items: center; gap: calc(var(--u) * 3);
    padding: 0 calc(var(--u) * 4); border-bottom: calc(var(--u) * 0.3) solid #e2e8f0;
  }
  .rate-row:nth-child(even) { background: #f7fafc; }
  .flag-img {
    width: min(calc(var(--u) * 17), calc(var(--v) * 9.4)); height: min(calc(var(--u) * 17), calc(var(--v) * 9.4));
    border-radius: 50%; object-fit: cover; border: calc(var(--u) * 0.6) solid #f5c842; flex-shrink: 0;
    box-shadow: 0 calc(var(--u) * 0.6) calc(var(--u) * 1.8) rgba(10,22,40,0.28);
  }
  .names { flex: 1; min-width: 0; }
  .currency-code { font-size: min(calc(var(--u) * 7.4), calc(var(--v) * 3.9)); font-weight: 800; color: #1a202c; line-height: 1.05; }
  .currency-desc { font-size: min(calc(var(--u) * 3.6), calc(var(--v) * 2.0)); font-weight: 600; color: #4a5568; line-height: 1.2; white-space: nowrap; }
  .rate-value {
    font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; font-weight: 800; color: #1a202c;
    font-size: min(calc(var(--u) * 11.4), calc(var(--v) * 6.2)); line-height: 1; white-space: nowrap;
  }
  .rate-value.none { font-family: 'Sarabun', 'Arial', sans-serif; font-size: min(calc(var(--u) * 5), calc(var(--v) * 2.8)); color: #a0aec0; font-weight: 700; }
  .notice { display: none; background: #fef3c7; color: #92400e; font-weight: 700; text-align: center;
    font-size: min(calc(var(--u) * 3.1), calc(var(--v) * 1.8)); line-height: 1.3; padding: calc(var(--v) * 0.9) calc(var(--u) * 4); flex-shrink: 0; }
  .notice.show { display: block; }
  .notice.down { background: #fee2e2; color: #991b1b; }
  .terms { background: #0a1628; color: #ffffff; text-align: center; font-weight: 600;
    font-size: min(calc(var(--u) * 2.9), calc(var(--v) * 1.65)); line-height: 1.35; padding: calc(var(--v) * 0.9) calc(var(--u) * 4); flex-shrink: 0; }
  .terms:empty { display: none; }
  .footer { background: #f1f5f9; color: #64748b; text-align: center; flex-shrink: 0;

  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }

function flagUrl(cc) { return FLAGS[cc] || ('https://flagcdn.com/w320/' + cc + '.png'); }

function parseCSV(csv) {
  var rows = [], lines = csv.split('\n');
  for (var k = 0; k < lines.length; k++) {
    var line = lines[k].replace(/\r$/, '');
    if (!line) continue;
    var cells = [], cell = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (ch === '"') { if (q && line[i + 1] === '"') { cell += '"'; i++; } else { q = !q; } }
      else if (ch === ',' && !q) { cells.push(cell.trim()); cell = ''; }
      else { cell += ch; }
    }
    cells.push(cell.trim()); rows.push(cells);
  }
  return rows;
}

var DATE_RE = /^(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{4})$/;

function fetchSheet() {
  var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?tqx=out:csv&headers=0&range=A1:L30&sheet=' + encodeURIComponent(SHEET_NAME);
  return fetch(url, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('sheet http ' + r.status);
    return r.text();
  }).then(function (text) {
    if (/^\s*</.test(text)) throw new Error('sheet returned a web page, not data');
    var rows = parseCSV(text), rates = {}, dateText = '';
    rows.forEach(function (row, i) {
      if (i < 2 && !dateText) { for (var c = 0; c < row.length; c++) { if (DATE_RE.test(row[c] || '')) { dateText = row[c]; break; } } }
      var name = (row[0] || '').trim();
      var v = parseFloat(String(row[RATE_COL] || '').replace(/,/g, ''));
      if (name && isFinite(v) && v > 0) rates[name] = v;
    });
    if (Object.keys(rates).length === 0) throw new Error('no rates in sheet');
    return { rates: rates, dateText: dateText, fetchedAt: Date.now() };
  });
}

function bangkokToday() {
  var parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Bangkok', day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(new Date());
  function get(t) { for (var i = 0; i < parts.length; i++) if (parts[i].type === t) return parseInt(parts[i].value, 10); }
  return { d: get('day'), m: get('month'), y: get('year') };
}

function isToday(dateText) {
  var m = DATE_RE.exec((dateText || '').trim());
  if (!m) return false;
  var t = bangkokToday();
  return parseInt(m[1], 10) === t.d && MONTHS.indexOf(m[2].toLowerCase()) + 1 === t.m && parseInt(m[3], 10) === t.y;
}

function lineRate(rates, line) {
  var best = null;
  for (var i = 0; i < line.names.length; i++) {
    var v = rates ? rates[line.names[i]] : undefined;
    if (!(typeof v === 'number' && isFinite(v) && v > 0)) return null;   // a note is missing: do not guess
    best = best === null ? v : Math.min(best, v);
  }
  return best;
}

function render(rates) {
  var h = '';
  LINES.forEach(function (line) {
    var v = lineRate(rates, line);
    h += '<div class="rate-row">' +
      '<img class="flag-img" src="' + flagUrl(line.flag) + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="names"><div class="currency-code">' + line.code + '</div><div class="currency-desc">' + line.desc + '</div></div>' +
      (v === null ? '<div class="rate-value none">Ask staff</div>' : '<div class="rate-value">' + v.toFixed(DECIMALS) + '</div>') +
      '</div>';
  });
  document.getElementById('rateRows').innerHTML = h;
}

function setNotice(text, down) {
  var el = document.getElementById('notice');
  el.textContent = text || '';
  el.className = 'notice' + (text ? ' show' : '') + (down ? ' down' : '');
}

function updateClock() {
  document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US',
    { timeZone: 'Asia/Bangkok', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function show(failed) {
  document.getElementById('liveDot').className = 'live-dot' + (failed ? ' off' : '');
  if (lastGood && isToday(lastGood.dateText)) {
    render(lastGood.rates); setNotice('');
  } else if (lastGood && !failed) {
    render(lastGood.rates);
    setNotice('Rates shown are from ' + (lastGood.dateText || 'an earlier day') + ". Today's rates are being updated. Please confirm with our staff.");
  } else {
    render(null);
    setNotice('Rates are temporarily unavailable on this screen. Please ask our staff.', true);
  }
  document.getElementById('rateDate').textContent = lastGood ? (lastGood.dateText || '--') : '--';
  document.getElementById('lastUpdate').textContent = lastGood
    ? new Date(lastGood.fetchedAt).toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' })
    : '--';
  updateClock();
}

function load() {
  fetchSheet().then(function (data) {
    lastGood = data;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(lastGood)); } catch (e) {}
    show(false);
  }).catch(function (e) {
    console.log('[VerticalBoard] ' + e.message);
    show(true);
  });
}

// After a power cut or restart, start from the last rates this screen read (only used if they are today's).
try {
  var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
  if (c && c.rates && typeof c.fetchedAt === 'number') lastGood = c;
} catch (e) {}

render(null);
updateClock();
load();
setInterval(load, REFRESH_MS);
setInterval(updateClock, 30 * 1000);
setInterval(function () { show(document.getElementById('liveDot').className.indexOf('off') >= 0); }, 60 * 1000);
</script>
</body>
</html>
